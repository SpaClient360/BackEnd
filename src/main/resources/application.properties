spring.application.name=CRM Module

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/droha_management
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=crm

# Swagger UI path: http://localhost:${server.port}/swagger-ui/index.html